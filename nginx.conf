events { worker_connections 1024; }

http {
    upstream zenith_nodes {
        # Docker Compose automatically resolves 'zenith' to all scaled instances
        server zenith:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://zenith_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Show which container handled the request (for testing!)
            add_header X-Handled-By $upstream_addr;
        }
    }
}
