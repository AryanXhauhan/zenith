---
# ─────────────────────────────────────────────────────────────────
#  Zenith – Horizontal Pod Autoscaler (HPA)
#  Module 5: Auto-scaling
#
#  Scale OUT when:  CPU > 70% OR Memory > 80%
#  Scale IN  when:  metrics drop below thresholds (stabilization 5 min)
#  Range:           3 (min) → 20 (max) replicas
# ─────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zenith-hpa
  namespace: zenith
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zenith-settlement-engine

  minReplicas: 3
  maxReplicas: 20

  metrics:
    # ── CPU-based scaling ─────────────────────────────────────────
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # ── Memory-based scaling ──────────────────────────────────────
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    # ── Scale OUT: aggressive (fast response to traffic spikes) ───
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max

    # ── Scale IN: conservative (avoid thrashing) ──────────────────
    scaleDown:
      stabilizationWindowSeconds: 300    # 5 minutes
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
