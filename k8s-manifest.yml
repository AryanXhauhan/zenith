apiVersion: v1
kind: ConfigMap
metadata:
  name: zenith-config
data:
  DB_HOST: "postgres-service"
  REDIS_HOST: "redis-service"
  ZENITH_MASTER_KEY: "dev-master-key-changeme"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenith-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zenith
  template:
    metadata:
      labels:
        app: zenith
    spec:
      containers:
      - name: zenith-engine
        image: zenith-settlement-engine:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: zenith-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        # Self-Healing: Restart if app hangs
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        # Traffic Management: Only send traffic if app is ready
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: zenith-service
spec:
  selector:
    app: zenith
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zenith-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zenith-engine
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
