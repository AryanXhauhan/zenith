version: '3.8'

services:
  # 1. MERCHANT DASHBOARD & CHECKOUT (Frontend)
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 2. SETTLEMENT ENGINE (Backend)
  backend:
    build: .
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/zenith
      - SPRING_DATASOURCE_USERNAME=zenith_user
      - SPRING_DATASOURCE_PASSWORD=zenith_secret
      - SPRING_DATA_REDIS_HOST=redis
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  # 3. DATABASE (Postgres)
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=zenith
      - POSTGRES_USER=zenith_user
      - POSTGRES_PASSWORD=zenith_secret
    ports:
      - "5432:5432"

  # 4. CACHE & RATE LIMITER (Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

networks:
  default:
    name: zenith-network
