
services:
  # The Load Balancer
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - zenith

  zenith:
    image: zenith-settlement-engine:latest
    # We REMOVED the port mapping here so instances don't fight
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/zenith
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 3

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=zenith
      - POSTGRES_USER=zenith_user
      - POSTGRES_PASSWORD=zenith_secret
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
